name: CIAgent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  commit-hygiene:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Fail on AI attribution in commit messages
      # Attribution patterns only (trailers and "Generated with/by" footers).
      # Bare model-name mentions like "support claude-sonnet-4-6" stay legal:
      # the rule targets attribution, not technical references.
      run: |
        pattern='co-authored-by:.*(claude|anthropic)|generated (with|by).*(claude|anthropic)'
        bad=$(git log --all -i -E --grep="$pattern" --format='%h %s')
        if [ -n "$bad" ]; then
          echo "AI attribution found in commit message(s):"
          echo "$bad"
          echo "Amend or rebase to drop the trailer/footer."
          exit 1
        fi
    - name: Fail on AI attribution in PR metadata
      if: github.event_name == 'pull_request'
      # The PR body becomes the squash-merge commit message, so title, body,
      # and branch name must be gated pre-merge, not just commits already on
      # the branch (this bit PR #67; caught manually). Fields are passed via
      # env, never interpolated inline into the script: PR titles and bodies
      # are untrusted input and inline ${{ }} is a script-injection vector.
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      run: |
        pattern='co-authored-by:.*(claude|anthropic)|generated (with|by).*(claude|anthropic)'
        fail=0
        check() {
          if printf '%s' "$2" | grep -qiE "$pattern"; then
            echo "AI attribution found in PR $1."
            fail=1
          fi
        }
        check "title" "$PR_TITLE"
        check "body" "$PR_BODY"
        check "branch name" "$PR_BRANCH"
        if printf '%s' "$PR_BRANCH" | grep -qi 'claude'; then
          echo "Branch name contains 'claude': $PR_BRANCH"
          fail=1
        fi
        if [ "$fail" -ne 0 ]; then
          echo "Scrub the offending surface(s) before merge."
          exit 1
        fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all,dev]"
    - name: Run tests
      run: |
        pytest

    - name: Verify CLI (Demo Agent)
      run: |
        # Install the package in editable mode
        pip install -e .
        
        # Run the demo agent tests
        # We need to set PYTHONPATH so the agent code can be imported
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        ciagent run --suite examples/demo_agent/ciagent.yaml --ci
